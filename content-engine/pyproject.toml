[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-engine"
version = "0.1.0"
description = "Short-form content production and experimentation engine"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg for the auto-editor (a system ffmpeg is used if present)
]

[project.optional-dependencies]
ai = ["anthropic>=0.69"]
dev = ["pytest>=8"]

[project.scripts]
engine = "engine.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
