            - {text: "*Es* vivo", meaning: "he's lively"}
            - {text: "*Está* vivo", meaning: "he's alive"}
    publish:
      description: >
        Estoy aburrido = I'm bored. Soy aburrido = I'm boring. Spanish has two verbs for "to be",
        and swapping them changes the meaning. Can you get the quiz right? 👇

