  name: af_heart          # English narrator (the teacher)
  speed: 1.12
  alt:
    es: {name: ef_dora, speed: 0.92}   # native Spanish voice for every <es>…</es> example, a bit slower for learners

style:
  kicker: Spanish in 60 seconds
